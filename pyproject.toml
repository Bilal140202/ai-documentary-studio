[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-documentary-studio"
version = "0.1.0"
description = "Autonomous multi-agent AI documentary production system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-documentary-studio" }]
dependencies = [
    "yt-dlp>=2024.1.0",
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "internetarchive>=3.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0", "anthropic>=0.40.0"]
vmr = ["torch>=2.0.0", "transformers>=4.40.0", "faiss-cpu>=1.7.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0", "ruff>=0.3.0", "mypy>=1.8.0"]

[project.scripts]
ai-documentary-studio = "ai_documentary_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
